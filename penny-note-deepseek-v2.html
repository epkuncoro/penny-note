<style>
:root{
  --s1:5px; --s2:8px; --s3:13px; --s4:21px; --s5:34px; --s6:55px; --s7:89px;
  --fs-xs:11px; --fs-sm:13px; --fs-md:16px; --fs-lg:21px; --fs-xl:26px; --fs-2xl:34px;
  --r1:13px; --r2:21px; --r3:34px;
  --bg:#F7F6F2; --surface:#FFFFFF; --line:#E8E4DC;
  --ink:#2E3A44; --ink2:#7E8892;
  --blue:#6B8CAE; --blue-dark:#4F6F91; --blue-deep:#3A5570;
  --blue-soft:#E5EDF4; --blue-tint:#F2F6FA;
  --in:#5F8E7E; --in-soft:#E4EFEA;
  --ex:#C2897E; --ex-soft:#F6E7E2;
  --accent:var(--blue-dark); --accent-soft:var(--blue-soft);
  --shadow:0 4px 21px rgba(46,58,68,.06), 0 1px 3px rgba(46,58,68,.04);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px;}
button:focus-visible,.chip:focus-visible,.cat-row:focus-visible,.chart-row:focus-visible,
.tx-row:focus-visible,.cal-day:focus-visible,.opt:focus-visible,.action-item:focus-visible,
.data-btn:focus-visible,.icon-btn:focus-visible,.nav-btn:focus-visible,.icon-opt:focus-visible,
.icon-tab:focus-visible,.icon-reset-btn:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}
input:focus-visible,.text-input:focus-visible,.date-input:focus-visible,
.chip-input input:focus-visible,.amount-wrap input:focus-visible{outline:none;box-shadow:none;}
body{
  margin:0;font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);font-size:var(--fs-md);line-height:1.618;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}
input{font-family:inherit;}
svg{display:block;}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  height:calc(var(--s6) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) var(--s3) 0 var(--s4);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(247,246,242,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(46,58,68,.05);
}
.brand{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.02em;}
.brand span{color:var(--blue-dark);}
.icon-btn{width:var(--s5);height:var(--s5);border-radius:var(--r1);display:grid;place-items:center;color:var(--ink);transition:background .18s,transform .18s;}
.icon-btn:active{background:rgba(46,58,68,.07);transform:scale(.94);}
.track{position:fixed;inset:0;z-index:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;}
.track::-webkit-scrollbar{display:none;}
.page{flex:0 0 100%;width:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;padding:calc(var(--s6) + env(safe-area-inset-top) + var(--s4)) var(--s4) calc(var(--s6) + var(--s5) + var(--s5) + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.view-pill-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease);}
.view-pill-wrap.show{grid-template-rows:1fr;}
.view-pill{overflow:hidden;min-height:0;}
.view-pill-inner{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);height:var(--s5);margin-bottom:var(--s3);padding:0 var(--s1) 0 var(--s3);border-radius:99px;background:var(--blue-soft);color:var(--blue-deep);font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em;box-shadow:0 4px 12px rgba(46,58,68,.08);opacity:0;transition:opacity .2s var(--ease);}
.view-pill-wrap.show .view-pill-inner{opacity:1;transition-delay:.08s;}
.view-pill button{width:24px;height:24px;border-radius:50%;background:rgba(79,111,145,.14);display:grid;place-items:center;color:var(--blue-deep);transition:transform .15s,background .15s;}
.view-pill button:active{transform:scale(.9);background:rgba(79,111,145,.24);}
.main-card{position:relative;border-radius:var(--r3);padding:var(--s5) var(--s4) var(--s4);background:linear-gradient(140deg,#7FA3C4 0%,#5B7E9E 100%);color:#fff;box-shadow:0 13px 34px rgba(91,126,158,.28);overflow:hidden;transition:transform .18s var(--ease);cursor:pointer;}
.main-card:active{transform:scale(.975);}
.main-card::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);top:-89px;right:-55px;pointer-events:none;}
.main-card::before{content:'';position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-55px;left:-21px;pointer-events:none;}
.mc-label{font-size:var(--fs-sm);opacity:.9;font-weight:600;letter-spacing:.03em;}
.mc-value{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;margin:var(--s1) 0 var(--s4);}
.mc-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);position:relative;z-index:1;}
.mc-mini{background:rgba(255,255,255,.18);border-radius:var(--r1);padding:var(--s3);backdrop-filter:blur(4px);}
.mc-mini .t{display:flex;align-items:center;gap:var(--s1);font-size:var(--fs-xs);font-weight:600;opacity:.92;}
.mc-mini .v{font-size:var(--fs-md);font-weight:700;margin-top:2px;letter-spacing:-.01em;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:var(--s5) var(--s1) var(--s3);}
.sec-head h3{font-size:var(--fs-md);font-weight:700;margin:0;letter-spacing:-.01em;}
.sec-head .sub{font-size:var(--fs-xs);color:var(--ink2);font-weight:600;}
.card{background:var(--surface);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden;}
.group-title{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);font-size:var(--fs-xs);font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;background:#FAF9F5;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.in{background:var(--in);} .dot.ex{background:var(--ex);}
.cat-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-top:1px solid var(--line);width:100%;text-align:left;font-family:inherit;font-size:inherit;color:inherit;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer;transition:background .15s;}
.cat-row:active{background:#FAF9F5;}
.cat-ic{width:var(--s5);height:var(--s5);border-radius:var(--r1);display:grid;place-items:center;flex-shrink:0;}
.cat-ic.in{background:var(--in-soft);color:var(--in);}
.cat-ic.ex{background:var(--ex-soft);color:var(--ex);}
.cat-main{flex:1;min-width:0;}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);}
.cat-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-amt{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;}
.cat-bar{height:5px;border-radius:99px;background:#F1EFE9;margin-top:6px;overflow:hidden;}
.cat-bar i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease);}
.cat-bar i.in{background:var(--in);} .cat-bar i.ex{background:var(--ex);}
.cat-chev{color:var(--ink2);opacity:.55;flex-shrink:0;}
.empty{padding:var(--s5) var(--s4);text-align:center;color:var(--ink2);font-size:var(--fs-sm);font-weight:600;}
.empty svg{margin:0 auto var(--s3);opacity:.4;}
.empty .sub{font-size:var(--fs-xs);font-weight:500;margin-top:var(--s1);opacity:.8;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3);padding:0 var(--s1);}
.cal-head .m{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;}
.cal-head button{width:var(--s5);height:var(--s5);border-radius:var(--r1);display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .18s;}
.cal-head button:active{transform:scale(.92);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1);}
.cal-dow{text-align:center;font-size:var(--fs-xs);font-weight:700;color:var(--ink2);padding:var(--s2) 0;letter-spacing:.06em;}
.cal-day{aspect-ratio:1;border-radius:var(--r1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--fs-sm);font-weight:600;color:var(--ink);transition:background .15s,transform .15s;}
.cal-day:active{transform:scale(.9);}
.cal-day.empty-cell{visibility:hidden;}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--blue-dark);color:var(--blue-dark);}
.cal-day.has{background:#FAF9F5;}
.cal-day .marks{display:flex;gap:3px;height:5px;}
.cal-day .m{width:5px;height:5px;border-radius:50%;}
.m.in{background:var(--in);} .m.ex{background:var(--ex);}
.legend{display:flex;gap:var(--s4);justify-content:center;margin-top:var(--s4);font-size:var(--fs-xs);color:var(--ink2);font-weight:600;}
.legend span{display:flex;align-items:center;gap:var(--s2);}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.legend i.in{background:var(--in);} .legend i.ex{background:var(--ex);}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--s6) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);font-size:var(--fs-xs);font-weight:700;transition:color .2s,transform .2s;}
.nav-btn.active{color:var(--blue-dark);}
.nav-btn:active{transform:scale(.94);}
.fab{position:fixed;right:var(--s4);bottom:calc(var(--s6) + env(safe-area-inset-bottom) + var(--s4));width:var(--s6);height:var(--s6);border-radius:50%;background:linear-gradient(135deg,#7FA3C4,#5B7E9E);color:#fff;z-index:35;display:grid;place-items:center;box-shadow:0 8px 21px rgba(91,126,158,.4);transition:transform .2s var(--ease),box-shadow .2s;}
.fab:active{transform:scale(.9);box-shadow:0 4px 13px rgba(91,126,158,.35);}
.backdrop{position:fixed;inset:0;background:rgba(46,58,68,.3);opacity:0;visibility:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s,visibility 0s .3s;}
.backdrop.show{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s 0s;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:90vh;max-height:90dvh;background:var(--surface);border-radius:var(--r3) var(--r3) 0 0;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s;box-shadow:0 -8px 34px rgba(46,58,68,.14);will-change:transform;overflow:hidden;}
.sheet.open{visibility:visible;transform:translateY(0);transition:transform .35s var(--ease),visibility 0s 0s;}
.sheet.full{max-height:100vh;max-height:100dvh;border-radius:0;}
#formSheet{z-index:100;}
.sheet-grip{padding:var(--s3) 0 var(--s1);display:grid;place-items:center;touch-action:none;cursor:grab;flex-shrink:0;}
.sheet-grip span{width:var(--s5);height:5px;border-radius:99px;background:#DEDAD2;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s1) var(--s3) var(--s3) var(--s4);touch-action:none;flex-shrink:0;}
.sheet-head h2{font-size:var(--fs-lg);font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.sheet-head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--s4) var(--s4);-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.sheet-foot{flex-shrink:0;padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));display:flex;gap:var(--s3);border-top:1px solid var(--line);background:var(--surface);}
.sheet-foot:empty{display:none;}
.sheet-fab{position:absolute;right:var(--s4);bottom:calc(var(--s4) + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--blue-dark);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(79,111,145,.42);z-index:5;transition:transform .15s,box-shadow .15s;}
.sheet-fab:active{transform:scale(.9);box-shadow:0 3px 10px rgba(79,111,145,.4);}
.confirm-msg{margin:0;font-size:var(--fs-sm);color:var(--ink2);line-height:1.65;}
.segmented{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#F1EFE9;border-radius:var(--r2);padding:5px;height:var(--s6);margin-bottom:var(--s4);}
.segmented .thumb{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:var(--r1);background:#fff;box-shadow:0 2px 8px rgba(46,58,68,.09);transition:transform .3s var(--ease);}
.segmented[data-type="income"] .thumb{transform:translateX(100%);}
.segmented button{position:relative;z-index:1;font-size:var(--fs-sm);font-weight:700;color:var(--ink2);transition:color .25s;}
.segmented[data-type="expense"] button[data-type="expense"]{color:var(--ex);}
.segmented[data-type="income"] button[data-type="income"]{color:var(--in);}
.field{margin-bottom:var(--s4);}
.field label{display:block;font-size:var(--fs-xs);font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--s2);}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:var(--s2) var(--s3);border-radius:99px;background:#F1EFE9;font-size:var(--fs-sm);font-weight:600;color:var(--ink2);transition:background .2s,color .2s,transform .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.chip:active{transform:scale(.94);}
.chip.active{background:var(--blue-dark);color:#fff;}
.chip .chip-ic{display:inline-flex;align-items:center;line-height:0;opacity:.9;}
.chip.active .chip-ic{opacity:1;}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink2);}
.chip.orphan{opacity:.72;}
.chip-input{display:flex;align-items:center;gap:4px;background:#F1EFE9;border-radius:99px;padding:2px 2px 2px var(--s3);box-shadow:inset 0 0 0 1.5px var(--blue);}
.chip-input input{border:0;background:transparent;outline:0;font-size:16px;font-weight:600;color:var(--ink);width:120px;min-width:90px;padding:6px 0;}
.chip-input button{width:28px;height:28px;border-radius:50%;background:var(--blue-dark);color:#fff;display:grid;place-items:center;transition:transform .15s;}
.chip-input button:active{transform:scale(.9);}
.chip-input.match{box-shadow:inset 0 0 0 1.5px var(--in);}
.chip-hint{width:100%;font-size:var(--fs-xs);font-weight:600;color:var(--blue-dark);padding:2px 0 0 var(--s2);opacity:0;transform:translateY(-4px);transition:opacity .15s var(--ease),transform .15s var(--ease);pointer-events:none;}
.chip-hint.show{opacity:1;transform:translateY(0);}
.amount-wrap{display:flex;align-items:center;gap:var(--s2);background:#F1EFE9;border-radius:var(--r2);height:68px;padding:0 var(--s4);transition:box-shadow .2s;}
.amount-wrap:focus-within{box-shadow:inset 0 0 0 2px var(--blue);}
.amount-wrap .cur{font-size:var(--fs-md);font-weight:700;color:var(--ink2);}
.amount-wrap input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:var(--fs-xl);font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.text-input,.date-input{width:100%;height:var(--s5);border-radius:var(--r1);border:0;background:#F1EFE9;padding:0 var(--s3);font-size:16px;font-weight:600;color:var(--ink);outline:0;transition:box-shadow .2s;}
.text-input:focus,.date-input:focus{box-shadow:inset 0 0 0 2px var(--blue);}
.btn-primary{flex:1;height:var(--s6);border-radius:var(--r2);background:var(--blue-dark);color:#fff;font-size:var(--fs-md);font-weight:700;transition:transform .15s,opacity .2s,background .2s;}
.btn-primary:active{transform:scale(.97);opacity:.9;}
.btn-primary.danger{background:var(--ex);}
.btn-ghost{height:var(--s6);padding:0 var(--s4);border-radius:var(--r2);background:#F1EFE9;color:var(--ink);font-size:var(--fs-sm);font-weight:700;transition:transform .15s;}
.btn-ghost:active{transform:scale(.95);}
.btn-ghost.danger{background:var(--ex-soft);color:var(--ex);}
.tx-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-top:1px solid var(--line);transition:background .15s;width:100%;text-align:left;}
.tx-row:active{background:#FAF9F5;}
.tx-ic{width:var(--s5);height:var(--s5);border-radius:var(--r1);display:grid;place-items:center;flex-shrink:0;}
.tx-ic.in{background:var(--in-soft);color:var(--in);}
.tx-ic.ex{background:var(--ex-soft);color:var(--ex);}
.tx-main{flex:1;min-width:0;}
.tx-cat{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-note{font-size:var(--fs-xs);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-amt{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;}
.tx-amt.in{color:var(--in);} .tx-amt.ex{color:var(--ex);}
.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;will-change:transform;}
.overlay.open{transform:translateY(0);visibility:visible;transition:transform .4s var(--ease),visibility 0s 0s;}
#catOverlay{z-index:72;}
.overlay-head{flex-shrink:0;display:flex;align-items:center;gap:var(--s2);height:calc(var(--s6) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--s3) 0 var(--s1);background:rgba(247,246,242,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(46,58,68,.05);}

<header class="topbar">

  <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
</header>

<div class="track" id="track">
  <section class="page" id="pageHome">
    <div class="view-pill-wrap" id="viewPillWrap">
      <div class="view-pill">
        <div class="view-pill-inner">
          <span id="viewPillText"></span>

        </div>
      </div>
    </div>
    <div class="main-card" id="mainCard" role="button" tabindex="0" aria-label="Riwayat Transaksi">

      <div class="mc-value" id="balanceVal">Rp 0</div>
      <div class="mc-row">
        <div class="mc-mini">
          <div class="t" id="lblInc"></div>
          <div class="v" id="incVal">Rp 0</div>
        </div>
        <div class="mc-mini">
          <div class="t" id="lblExp"></div>
          <div class="v" id="expVal">Rp 0</div>
        </div>
      </div>
    </div>

    <div class="sec-head">
      <h3 id="lblBreakdown">Rincian</h3>
      <span class="sub" id="monthLabel"></span>
    </div>
    <div id="breakdown"></div>
  </section>

  <section class="page" id="pageCal">
    <div class="cal-head">
      <button id="calPrev" aria-label="Sebelumnya"></button>
      <div class="m" id="calTitle"></div>
      <button id="calNext" aria-label="Berikutnya"></button>
    </div>
    <div class="card" style="padding:var(--s3) var(--s3) var(--s4)">
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>

        <span><i class="in"></i><em id="lgIn" style="font-style:normal">Pemasukan</em></span>
        <span><i class="ex"></i><em id="lgEx" style="font-style:normal">Pengeluaran</em></span>
      </div>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="0">
    <span id="niHome"></span><span id="nlHome">Beranda</span>
  </button>
  <button class="nav-btn" data-page="1">
    <span id="niCal"></span><span id="nlCal">Kalender</span>
  </button>
</nav>

<button class="fab" id="fab" aria-label="Tambah Transaksi"></button>

<div class="sheet" id="formSheet">
  <div class="sheet-grip"><span></span></div>
  <div class="sheet-head">
    <h2 id="formTitle">Tambah Transaksi</h2>
    <div class="sheet-head-actions">

    </div>
  </div>
  <div class="sheet-body">

      <button data-type="expense" id="segExp">Pengeluaran</button>
      <button data-type="income" id="segInc">Pemasukan</button>
    </div>

    <div class="field">
      <label id="lblCat">Kategori</label>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="field">
      <label id="lblAmount">Nominal</label>
      <div class="amount-wrap">
        <span class="cur" id="curSymbol">Rp</span>
        <input type="text" id="amountInput" inputmode="numeric" placeholder="0" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label id="lblNote">Catatan</label>
      <input type="text" class="text-input" id="noteInput" maxlength="60" placeholder="Opsional…">
    </div>

    <div class="field" style="margin-bottom:0">
      <label id="lblDate">Tanggal</label>
      <input type="date" class="date-input" id="dateInput">
    </div>
  </div>
  <div class="sheet-foot">
    <button class="btn-ghost danger" id="deleteBtn" hidden>Hapus</button>
    <button class="btn-primary" id="saveBtn">Simpan</button>
  </div>
</div>

<div class="sheet" id="daySheet">
  <div class="sheet-grip"><span></span></div>
  <div class="sheet-head">
    <h2 id="dayTitle">—</h2>
    <div class="sheet-head-actions">

    </div>
  </div>
  <div class="sheet-body" id="dayBody" style="padding-bottom:100px"></div>
  <button class="sheet-fab" id="dayFab" aria-label="Tambah"></button>

<div class="overlay" id="historyOverlay">

    <h2 id="histTitle">Riwayat Transaksi</h2>
  </div>
  <div class="overlay-body" id="histBody"></div>
</div>

<div class="overlay" id="catOverlay">

    <button class="icon-btn" id="catClose" aria-label="Kembali"></button>
    <h2 id="catTitle">—</h2>
  </div>
  <div class="overlay-body" id="catBody"></div>
</div>

<aside class="side-menu" id="sideMenu">
  <div class="sm-head">
    <h2 id="smTitle">Pengaturan</h2>
    <button class="icon-btn" id="smClose" aria-label="Tutup"></button>
  </div>
  <div class="sm-body">
    <div class="sm-group">
      <div class="sm-label" id="lblCur">Mata Uang</div>
      <div class="opt-list" id="curList"></div>
    </div>
    <div class="sm-group">

      <div class="opt-list" id="langList"></div>
    </div>

      <button class="data-btn" id="importBtn"><span id="impIcon"></span><span id="impText">Impor Data</span></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <button class="danger-btn" id="resetBtn"></button>
  </div>
</aside>
<div class="backdrop" id="smBackdrop" style="z-index:75"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ===================== SANITIZE ===================== */
function sanitizeTxList(rawList){
  if(!Array.isArray(rawList)) return [];
  const out = [];
  const seenIds = new Set();
  let dupCounter = 0;
  for(const x of rawList){
    if(!x || typeof x !== 'object') continue;
    if(x.type !== 'income' && x.type !== 'expense') continue;
    if(typeof x.category !== 'string' || !x.category) continue;
    if(typeof x.amount !== 'number' || !isFinite(x.amount) || x.amount < 0) continue;
    if(typeof x.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(x.date)) continue;

    const [yy,mm,dd] = x.date.split('-').map(Number);
    const checkDate = new Date(yy, mm-1, dd);
    if(checkDate.getFullYear() !== yy || checkDate.getMonth() !== mm-1 || checkDate.getDate() !== dd) continue;

    let id = (typeof x.id === 'string' && x.id) ? x.id.slice(0,64) : ('tx_' + Math.random().toString(36).slice(2,10));
    if(seenIds.has(id)){
      dupCounter++;
      id = id + '_dup' + dupCounter;
    }
    seenIds.add(id);

    out.push({
      id, type: x.type,
      category: x.category.slice(0,60),
      amount: x.amount,
      note: typeof x.note === 'string' ? x.note.slice(0,120) : '',
      date: x.date,
      createdAt: (typeof x.createdAt === 'number' && isFinite(x.createdAt)) ? x.createdAt : 0
    });
  }
  return out;
}

function sanitizeCats(raw, lang){
  const defaults = getDefaultCats(lang || 'id');
  if(!raw || !Array.isArray(raw.expense) || !Array.isArray(raw.income)) return defaults;
  const clean = (arr)=>{
    const seen = new Set();
    const out = [];
    for(const c of arr){
      if(typeof c !== 'string') continue;
      const name = c.trim().slice(0,60);
      if(!name) continue;
      const key = name.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(name);
    }
    return out;
  };
  const result = { expense: clean(raw.expense), income: clean(raw.income) };
  if(!result.expense.length && !result.income.length) return defaults;
  return result;
}

function sanitizeCatIcons(raw, cats){
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
  const out = {};
  for(const k of Object.keys(raw)){
    const v = raw[k];
    if(typeof v !== 'string' || !ICONS[v]) continue;
    const i = k.indexOf(':');
    if(i <= 0) continue;
    const type = k.slice(0, i);
    const name = k.slice(i + 1);
    if(type !== 'expense' && type !== 'income') continue;
    if(!cats[type] || !cats[type].includes(name)) continue;
    out[k] = v;
  }
  return out;
}

}

/* ===================== TRANSLATE DEFAULT CATEGORIES ===================== */
function applyLangToDefaultCats(newLang){
  const targets = DEFAULT_CATS_I18N[newLang];
  if(!targets) return false;
  let touched = false;

  for(const type of ['expense','income']){
    const list = state.cats[type];
    if(!Array.isArray(list)) continue;
    const targetList = targets[type];

    for(let i=0; i<list.length; i++){
      const oldName = list[i];
      const meta = DEFAULT_CATS_LOOKUP[oldName.toLowerCase()];
      if(!meta || meta.type !== type) continue;

      const newName = targetList[meta.idx];
      if(!newName || newName === oldName) continue;

      if(list.some((c,j)=> j!==i && c.toLowerCase() === newName.toLowerCase())) continue;

      list[i] = newName;
      touched = true;

      for(const tx of state.tx){
        if(tx.type === type && tx.category === oldName) tx.category = newName;
      }

      const oldKey = catIconKey(type, oldName);
      const newKey = catIconKey(type, newName);
      if(state.catIcons[oldKey] && !state.catIcons[newKey]){
        state.catIcons[newKey] = state.catIcons[oldKey];
      }
      delete state.catIcons[oldKey];

      if(typeof selectedCat !== 'undefined' && selectedCat === oldName && formType === type){
        selectedCat = newName;
      }
      if(typeof currentCatView !== 'undefined' && currentCatView &&
         currentCatView.cat === oldName && currentCatView.type === type){
        currentCatView.cat = newName;
      }
    }
  }

  for(const type of ['expense','income']){
    const list = state.cats[type];
    if(!Array.isArray(list)) continue;
    const targetList = targets[type];

    for(let i = list.length - 1; i >= 0; i--){
      const name = list[i];
      const meta = DEFAULT_CATS_LOOKUP[name.toLowerCase()];
      if(!meta || meta.type !== type) continue;
      const target = targetList[meta.idx];
      if(!target || name === target) continue;
      if(!list.some((c,j)=> j!==i && c.toLowerCase() === target.toLowerCase())) continue;
      const hasTx = state.tx.some(tx => tx.type === type && tx.category === name);
      if(hasTx) continue;
      list.splice(i, 1);
      delete state.catIcons[catIconKey(type, name)];
      touched = true;
    }
  }

  return touched;
}

const fmtCache = {};
function money(n){
  const c = CURRENCIES[state.currency];
  if(!fmtCache[state.currency]){
    fmtCache[state.currency] = new Intl.NumberFormat(c.locale,{
      style:'currency',currency:c.code,
      minimumFractionDigits:c.decimals,maximumFractionDigits:c.decimals
    });
  }
  return fmtCache[state.currency].format(n||0);
}
const nfInt = {};
function groupDigits(str){
  const loc = CURRENCIES[state.currency].locale;
  if(!nfInt[loc]) nfInt[loc] = new Intl.NumberFormat(loc,{maximumFractionDigits:0});
  return nfInt[loc].format(Number(str||0));
}
const MAX_INT_DIGITS = 13;

function normalizeAmount(raw){
  const dec = CURRENCIES[state.currency].decimals;
  const v = String(raw == null ? '' : raw);
  if(dec === 0) return v.replace(/\D/g,'').slice(0, MAX_INT_DIGITS);
  let cleaned = v.replace(/[^\d.]/g,'');
  const firstDot = cleaned.indexOf('.');
  if(firstDot !== -1) cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g,'');
  const parts  = cleaned.split('.');
  const hasDot = cleaned.includes('.');
  const intRaw  = parts[0].replace(/\D/g,'').slice(0, MAX_INT_DIGITS);
  const fracRaw = parts.length > 1 ? parts[1].replace(/\D/g,'').slice(0,2) : '';
  if(!hasDot && !intRaw) return '';
  const int = intRaw || '0';
  return int + (hasDot ? '.' + fracRaw : '');
}
function convertRawToCurrency(raw){
  if(!raw) return '';
  const num = parseFloat(raw);
  if(!isFinite(num) || num < 0) return '';
  const c = CURRENCIES[state.currency];
  if(c.decimals === 0) return String(Math.floor(num)).slice(0, MAX_INT_DIGITS);
  const fixed = num.toFixed(c.decimals);
  const [i,f] = fixed.split('.');
  return i.slice(0, MAX_INT_DIGITS) + (f ? '.' + f : '');
}

}

function catColorDeep(name){ return `hsl(${catHue(name)}, 42%, 48%)`; }
function catColorSoft(name){ return `hsl(${catHue(name)}, 45%, 94%)`; }

/* ===================== WEEK START ===================== */
const WEEK_START_CACHE = {};
function getWeekStart(){
  const loc = localeFull();
  if(WEEK_START_CACHE[loc] !== undefined) return WEEK_START_CACHE[loc];
  let ws = 1;
  try{
    const il = new Intl.Locale(loc);
    const info = (typeof il.getWeekInfo === 'function') ? il.getWeekInfo() : (il.weekInfo || null);
    if(info && typeof info.firstDay === 'number') ws = info.firstDay;
  }catch(_){}
  WEEK_START_CACHE[loc] = ws;
  return ws;
}

/* ===================== SHEET ===================== */
const sheetStack = [];

class Sheet{
  constructor(el){
    this.el = el;
    this.bodyEl = el.querySelector('.sheet-body');
    this.fullscreen = false;
    this.dragging = false;
    this.baseX = '';
    this.onClose = null;
    this._prevFocus = null;

    const z = parseInt(getComputedStyle(el).zIndex)||60;
    this.bd = document.createElement('div');
    this.bd.className = 'backdrop';
    this.bd.style.zIndex = z - 1;
    document.body.appendChild(this.bd);
    this._onBd = ()=>this.close();
    this.bd.addEventListener('click', this._onBd);

    this._onMove = e=>this._move(e);
    this._onUp   = e=>this._up(e);

    [el.querySelector('.sheet-grip'), el.querySelector('.sheet-head')].forEach(g=>{
      if(!g) return;
      g.addEventListener('pointerdown', e=>this._down(e));
    });

    document.addEventListener('pointermove', this._onMove);
    document.addEventListener('pointerup', this._onUp);
    document.addEventListener('pointercancel', this._onUp);

    if(this.bodyEl){
      this.bodyEl.addEventListener('scroll', ()=>{
        if(this.fullscreen) return;
        if(this.bodyEl.scrollTop > 1 && this.bodyEl.scrollHeight > this.bodyEl.clientHeight + 4){
          this.goFullscreen();
        }
      }, {passive:true});
    }

    el.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>this.close()));
  }
  destroy(){
    document.removeEventListener('pointermove', this._onMove);
    document.removeEventListener('pointerup', this._onUp);
    document.removeEventListener('pointercancel', this._onUp);
    if(this.bd){
      this.bd.removeEventListener('click', this._onBd);
      if(this.bd.parentNode) this.bd.remove();
    }
    const i = sheetStack.indexOf(this);
    if(i >= 0) sheetStack.splice(i, 1);
  }
  _down(e){
    if(e.target.closest('button')) return;
    this.dragging = true;
    this.startY = e.clientY;
    this.baseX = window.matchMedia('(min-width:640px)').matches ? 'translateX(-50%) ' : '';
    this.el.style.transition = 'none';
    try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }
  _move(e){
    if(!this.dragging) return;
    let dy = e.clientY - this.startY;
    if(dy < 0) dy *= 0.35;
    this.el.style.transform = `${this.baseX}translateY(${dy}px)`;
  }
  _up(e){
    if(!this.dragging) return;
    this.dragging = false;
    const dy = (e && typeof e.clientY === 'number') ? (e.clientY - this.startY) : 0;
    this.el.style.transition = '';
    this.el.style.transform = '';
    const h = this.el.offsetHeight || 1;

    if(dy > 0){
      if(this.fullscreen){
        if(dy > 80){
          this.fullscreen = false;
          this.el.classList.remove('full');
          if(this.bodyEl) this.bodyEl.scrollTop = 0;
        }
      }else{
        if(dy > h * 0.28) this.close();
      }
    }else if(dy < -30 && this.bodyEl && this.bodyEl.scrollHeight > this.bodyEl.clientHeight + 4){
      this.goFullscreen();
    }
  }
  goFullscreen(){
    if(this.fullscreen) return;
    this.fullscreen = true;
    this.el.classList.add('full');
  }
  open(){
    if(document.activeElement && document.activeElement !== document.body){
      this._prevFocus = document.activeElement;
    }
    this.fullscreen = false;
    this.dragging = false;
    this.el.classList.remove('full');
    if(this.bodyEl) this.bodyEl.scrollTop = 0;

    const baseX = window.matchMedia('(min-width:640px)').matches ? 'translateX(-50%) ' : '';
    this.el.style.transition = 'none';
    this.el.style.transform = `${baseX}translateY(101%)`;
    this.el.classList.add('open');
    this.bd.classList.add('show');
    void this.el.offsetHeight;
    this.el.style.transition = '';
    this.el.style.transform = '';

    if(!sheetStack.includes(this)) sheetStack.push(this);
  }
  close(){
    const wasOpen = this.el.classList.contains('open');
    this.dragging = false;
    this.el.style.transform = '';
    this.el.classList.remove('open','full');
    this.fullscreen = false;
    this.bd.classList.remove('show');

    const i = sheetStack.indexOf(this);
    if(i >= 0) sheetStack.splice(i, 1);

    const prev = this._prevFocus;
    this._prevFocus = null;
    if(prev && document.body.contains(prev) && typeof prev.focus === 'function'){
      setTimeout(()=>{ try{ prev.focus({preventScroll:true}); }catch(_){} }, 50);
    }
    if(wasOpen && typeof this.onClose === 'function'){
      try{ this.onClose(); }catch(_){}
    }
  }
}

/* ===================== TRACK / NAV ===================== */
const track = $('#track');
const navBtns = $$('.nav-btn');
let animId = null;

function goPage(i){
  i = Math.max(0, Math.min(navBtns.length - 1, i));
  const target = i * track.clientWidth;
  track.style.scrollSnapType = 'none';
  animateScrollLeft(track, target, 240, ()=>{ track.style.scrollSnapType = ''; });
  navBtns.forEach((b,idx)=>b.classList.toggle('active', idx === i));
}
function animateScrollLeft(el, target, duration, done){
  if(animId) cancelAnimationFrame(animId);
  const start = el.scrollLeft;
  const delta = target - start;
  if(Math.abs(delta) < 1){ el.scrollLeft = target; done && done(); return; }
  const t0 = performance.now();
  const step = now=>{
    const p = Math.min(1, (now - t0) / duration);
    const e = 1 - Math.pow(1 - p, 3);
    el.scrollLeft = start + delta * e;
    if(p < 1){ animId = requestAnimationFrame(step); }
    else { animId = null; done && done(); }
  };
  animId = requestAnimationFrame(step);
}
navBtns.forEach(b=>b.addEventListener('click',()=>goPage(+b.dataset.page)));

let rafPending = false;
track.addEventListener('scroll',()=>{
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    updateViewPill();
    if(animId) return;
    const i = Math.round(track.scrollLeft / track.clientWidth);
    navBtns.forEach((b,idx)=>b.classList.toggle('active', idx === i));
  });
},{passive:true});

let mouseDrag = null;
track.addEventListener('pointerdown', e=>{
  if(e.pointerType !== 'mouse') return;
  if(e.button !== 0) return;
  if(e.target.closest('button, a, input, select, textarea, .chip, .tx-row, .opt, .icon-btn, .cal-day, .cat-row, .chart-row, .icon-tab, .icon-reset-btn, [role="button"]')) return;
  mouseDrag = { startX:e.clientX, startScroll:track.scrollLeft, moved:false };
  track.style.scrollSnapType = 'none';
  track.style.cursor = 'grabbing';
  try{ track.setPointerCapture(e.pointerId); }catch(_){}
});
track.addEventListener('pointermove', e=>{
  if(!mouseDrag) return;
  const dx = e.clientX - mouseDrag.startX;
  if(Math.abs(dx) > 3) mouseDrag.moved = true;
  track.scrollLeft = mouseDrag.startScroll - dx;
});
function endMouseDrag(){
  if(!mouseDrag) return;
  const moved = mouseDrag.moved;
  mouseDrag = null;
  track.style.cursor = '';
  if(!moved){ track.style.scrollSnapType = ''; return; }
  const i = Math.round(track.scrollLeft / track.clientWidth);
  goPage(Math.max(0, Math.min(navBtns.length - 1, i)));
}
track.addEventListener('pointerup', endMouseDrag);
track.addEventListener('pointercancel', endMouseDrag);

/* ===================== RENDER CALENDAR ===================== */
let calYear, calMonth;
const todayDate = new Date();
calYear = todayDate.getFullYear();
calMonth = todayDate.getMonth();

const DOW_CACHE = {};
function dowNames(){
  const loc = localeFull();
  if(!DOW_CACHE[loc]){
    const ws = getWeekStart();
    const offsetFromMon = ws - 1;
    const base = new Date(2024,0,1);
    DOW_CACHE[loc] = Array.from({length:7},(_,i)=>{
      const d = new Date(base); d.setDate(base.getDate() + offsetFromMon + i);
      return new Intl.DateTimeFormat(loc,{weekday:'short'}).format(d);
    });
  }
  return DOW_CACHE[loc];
}
function renderCalendar(){
  $('#calDow').innerHTML = dowNames().map(d=>`<div class="cal-dow">${d}</div>`).join('');
  $('#calTitle').textContent = new Intl.DateTimeFormat(localeFull(),{month:'long',year:'numeric'}).format(new Date(calYear,calMonth,1));

  const prefix = `${calYear}-${pad(calMonth+1)}`;
  const map = {};
  for(const tx of state.tx){
    if(!tx.date.startsWith(prefix)) continue;
    const m = map[tx.date] || (map[tx.date] = {in:0,ex:0});
    if(tx.type === 'income') m.in += tx.amount; else m.ex += tx.amount;
  }

  const first = new Date(calYear,calMonth,1);
  const jsDow = first.getDay();
  const isoDow = jsDow === 0 ? 7 : jsDow;
  const ws = getWeekStart();
  const offset = (isoDow - ws + 7) % 7;

  const days = new Date(calYear,calMonth+1,0).getDate();
  const todayKey = toKey(new Date());

  let html = '';
  for(let i=0;i<offset;i++) html += `<div class="cal-day empty-cell"></div>`;
  for(let d=1;d<=days;d++){
    const key = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const m = map[key];
    const isToday = key === todayKey;
    let marks = '<span class="marks"></span>';
    if(m){
      marks = `<span class="marks">`;
      if(m.in>0) marks += `<i class="m in"></i>`;
      if(m.ex>0) marks += `<i class="m ex"></i>`;
      marks += `</span>`;
    }
    html += `<button class="cal-day${isToday?' today':''}${m?' has':''}" data-date="${key}">
      <span>${d}</span>${marks}
    </button>`;
  }
  $('#calGrid').innerHTML = html;
}

let formType = 'expense';
let selectedCat = '';
let rawAmount = '';
let newCatMode = false;

const amountInput = $('#amountInput');
const noteInput = $('#noteInput');
const dateInput = $('#dateInput');

function renderFormLabels(){
  $('#formTitle').textContent = editingId ? t('editTx') : t('addTx');
  $('#saveBtn').textContent = editingId ? t('update') : t('save');
  $('#deleteBtn').hidden = !editingId;
  $('#deleteBtn').textContent = t('delete');
  $('#lblCat').textContent = t('cat');
  $('#lblAmount').textContent = t('amount');
  $('#lblNote').textContent = t('note');
  $('#lblDate').textContent = t('date');
  $('#segExp').textContent = t('expense');
  $('#segInc').textContent = t('income');
  noteInput.placeholder = t('notePh');
  $('#formClose').setAttribute('aria-label', t('cancel'));
}

function renderAmountWrap(){
  const c = CURRENCIES[state.currency];
  amountInput.inputMode = c.decimals > 0 ? 'decimal' : 'numeric';
  $('#curSymbol').textContent = c.symbol;
  amountInput.value = rawAmount ? formatRaw(rawAmount) : '';
}
function setType(type){
  formType = type;
  $('#typeSwitch').dataset.type = type;
  newCatMode = false;
  renderAmountWrap();
  renderChips();
}
function renderChips(){
  const baseList = state.cats[formType] || [];
  const isOrphan = selectedCat && !baseList.includes(selectedCat);
  const list = isOrphan ? [...baseList, selectedCat] : baseList;

  if(!list.length) selectedCat = '';
  else if(!selectedCat || !list.includes(selectedCat)) selectedCat = list[0];

  const chipsHtml = list.map(c=>{
    const orphanCls = (isOrphan && c === selectedCat) ? ' orphan' : '';
    return `<button class="chip${c===selectedCat?' active':''}${orphanCls}" data-cat="${esc(c)}">
      <span class="chip-ic">${icon(catIcon(c, formType),13)}</span>${esc(c)}
    </button>`;
  }).join('');

  const addHtml = newCatMode
    ? `<div class="chip-input" id="chipInput">
         <input type="text" id="newCatInput" maxlength="24" placeholder="${t('newCatPh')}" autocomplete="off">
         <button id="newCatOk" aria-label="OK">${icon('check',14)}</button>
       </div>
       <div class="chip-hint" id="chipHint"></div>`
    : `<button class="chip ghost" id="addCatChip">${icon('plus',13)}${t('newCat')}</button>`;

  $('#catChips').innerHTML = chipsHtml + addHtml;

  if(newCatMode){
    const inp  = $('#newCatInput');
    const hint = $('#chipHint');
    const wrap = $('#chipInput');

    setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 40);

    const updateHint = ()=>{
      const v = inp.value.trim();
      const exists = v && state.cats[formType].some(c => c.toLowerCase() === v.toLowerCase());
      hint.textContent = exists ? t('catExistsHint') : '';
      hint.classList.toggle('show', !!exists);
      wrap.classList.toggle('match', !!exists);
    };
    updateHint();
    inp.addEventListener('input', updateHint);

    $('#newCatOk').addEventListener('click', commitNewCat);
    inp.addEventListener('keydown', e=>{
      if(e.isComposing) return;
      if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); commitNewCat(); }
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); cancelNewCat(); }
    });
  }
}
function commitNewCat(){
  const inp = $('#newCatInput');
  if(!inp) return;
  const name = inp.value.trim();
  if(!name){ cancelNewCat(); return; }

  const existing = state.cats[formType].find(c => c.toLowerCase() === name.toLowerCase());
  if(existing){ selectedCat = existing; newCatMode = false; renderChips(); return; }

  state.cats[formType].push(name);
  selectedCat = name;
  save();
  newCatMode = false;
  renderChips();
  toast(t('catAdded')(name));
}
function cancelNewCat(){ newCatMode = false; renderChips(); }

let pressTimer = null, pressTriggered = false, pressStart = null;
const chipsEl = $('#catChips');

chipsEl.addEventListener('click', e=>{
  const addBtn = e.target.closest('#addCatChip');
  if(addBtn){ newCatMode = true; renderChips(); return; }
  if(pressTriggered){ pressTriggered = false; return; }
  const chip = e.target.closest('.chip[data-cat]');
  if(!chip) return;
  selectedCat = chip.dataset.cat;
  if(newCatMode){ newCatMode = false; renderChips(); return; }
  $$('#catChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.cat === selectedCat));
});
chipsEl.addEventListener('pointerdown', e=>{
  const chip = e.target.closest('.chip[data-cat]');
  if(!chip) return;
  if(!state.cats[formType].includes(chip.dataset.cat)) return;
  pressStart = { x:e.clientX, y:e.clientY };
  pressTriggered = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(()=>{
    pressTriggered = true;
    pressStart = null;
    openCatActions(chip.dataset.cat);
    try{ if(navigator.vibrate) navigator.vibrate(30); }catch(_){}
  }, 480);
});
chipsEl.addEventListener('contextmenu', e=>{
  if(e.target.closest('.chip[data-cat]')) e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!pressStart) return;
  if(Math.abs(e.clientX - pressStart.x) > 10 || Math.abs(e.clientY - pressStart.y) > 10){
    clearTimeout(pressTimer); pressStart = null;
  }
});
document.addEventListener('pointerup', ()=>{ clearTimeout(pressTimer); pressStart = null; });
document.addEventListener('pointercancel', ()=>{ clearTimeout(pressTimer); pressStart = null; });

function openCatActions(cat){
  const actions = [
    { label:t('editCat'),   icon:'pencil',  onClick:()=>renameCategory(cat) },
    { label:t('editIcon'),  icon:'palette', onClick:()=>pickIconForCategory(cat) },
    { label:t('deleteCat'), icon:'trash',   danger:true, onClick:()=>deleteCategory(cat) }
  ];
  openActionSheet(cat, actions);
}

function pickIconForCategory(cat){
  const type = formType;
  const key  = catIconKey(type, cat);
  const current = state.catIcons[key] || '';
  openIconPicker({
    current,
    onPick:(iconName)=>{
      if(iconName === '__auto__') delete state.catIcons[key];
      else state.catIcons[key] = iconName;
      save();
      renderChips();
      refreshAll();
      if(daySheet.el.classList.contains('open')) refreshDayBody();
      toast(t('iconChanged'));
    }
  });
}

function renameCategory(oldName){
  openPromptSheet({
    title: t('renameCat'),
    value: oldName,
    placeholder: t('newCatPh'),
    onConfirm: (newName)=>{
      const clean = newName.trim();
      if(!clean || clean === oldName) return;
      if(state.cats[formType].some(c => c !== oldName && c.toLowerCase() === clean.toLowerCase())){
        toast(t('catExists'));
        return;
      }
      const idx = state.cats[formType].indexOf(oldName);
      if(idx === -1) return;
      state.cats[formType][idx] = clean;
      const oldKey = catIconKey(formType, oldName);
      const newKey = catIconKey(formType, clean);
      if(state.catIcons[oldKey]){
        state.catIcons[newKey] = state.catIcons[oldKey];
        delete state.catIcons[oldKey];
      }
      for(const tx of state.tx){
        if(tx.type === formType && tx.category === oldName) tx.category = clean;
      }
      if(selectedCat === oldName) selectedCat = clean;
      if(currentCatView && currentCatView.cat === oldName && currentCatView.type === formType){
        currentCatView.cat = clean;
      }
      save();
      renderChips();
      refreshAll();
      if(daySheet.el.classList.contains('open')) refreshDayBody();
      toast(t('catRenamed'));
    }
  });
}
function deleteCategory(cat){
  openConfirmSheet({
    title: t('delCatTitle'),
    message: t('delCatConfirm')(cat),
    confirmLabel: t('delete'),
    danger: true,
    onConfirm: ()=>{
      state.cats[formType] = state.cats[formType].filter(c=>c !== cat);
      delete state.catIcons[catIconKey(formType, cat)];
      if(selectedCat === cat) selectedCat = state.cats[formType][0] || '';
      save();
      renderChips();
      refreshAll();
      toast(t('catDeleted')(cat));
    }
  });
}

$('#typeSwitch').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-type]');
  if(!btn || btn.dataset.type === formType) return;
  selectedCat = '';
  setType(btn.dataset.type);
});

function formatRaw(raw){
  const dec = CURRENCIES[state.currency].decimals;
  if(!raw) return '';
  if(dec === 0) return groupDigits(raw);
  const [i,d] = raw.split('.');
  const int = groupDigits(i || '0');
  return raw.includes('.') ? `${int}.${(d||'').slice(0,2)}` : int;
}

amountInput.addEventListener('input', ()=>{
  const prevValue = amountInput.value;
  const selStart = (amountInput.selectionStart == null) ? prevValue.length : amountInput.selectionStart;
  const digitsBefore = (prevValue.slice(0, selStart).match(/\d/g) || []).length;

  rawAmount = normalizeAmount(prevValue);
  const newValue = formatRaw(rawAmount);
  amountInput.value = newValue;

  let count = 0;
  let newPos = newValue.length;
  for(let i = 0; i < newValue.length; i++){
    if(count === digitsBefore){ newPos = i; break; }
    if(/\d/.test(newValue[i])) count++;
  }
  try{ amountInput.setSelectionRange(newPos, newPos); }catch(_){}
});

function openForm(tx, overrideDate){
  editingId = tx ? tx.id : null;
  formType = tx ? tx.type : 'expense';
  selectedCat = tx ? tx.category : '';
  newCatMode = false;

  dateInput.value = tx ? tx.date : (overrideDate || toKey(new Date()));
  noteInput.value = tx ? (tx.note || '') : '';
  rawAmount = tx ? convertRawToCurrency(String(tx.amount)) : '';
  amountInput.value = tx ? formatRaw(rawAmount) : '';

  $('#typeSwitch').dataset.type = formType;
  renderFormLabels();
  renderAmountWrap();
  renderChips();
  formSheet.open();
}

$('#saveBtn').addEventListener('click',()=>{
  const amount = parseFloat(rawAmount) || 0;
  if(!selectedCat){ toast(t('emptyCatSel')); return; }
  if(amount <= 0){ toast(t('zeroAmount')); amountInput.focus(); return; }
  const date = dateInput.value || toKey(new Date());

  if(editingId){
    const tx = state.tx.find(x=>x.id === editingId);
    if(tx){
      tx.type = formType;
      tx.category = selectedCat;
      tx.amount = amount;
      tx.note = noteInput.value.trim();
      tx.date = date;
    }
    toast(t('updated'));
  }else{
    state.tx.push({
      id: 'tx_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      type: formType,
      category: selectedCat,
      amount,
      note: noteInput.value.trim(),
      date,
      createdAt: Date.now()
    });
    toast(t('saved'));
  }
  save();
  formSheet.close();
  refreshAll();
  if(daySheet.el.classList.contains('open')) setTimeout(refreshDayBody, 120);
});

$('#deleteBtn').addEventListener('click',()=>{

  openConfirmSheet({
    title: t('delTxTitle'),
    message: t('delTxConfirm'),
    confirmLabel: t('delete'),

    onConfirm: ()=>{

      save();
      formSheet.close();
      toast(t('deleted'));
      refreshAll();
      if(daySheet.el.classList.contains('open')) setTimeout(refreshDayBody, 120);
    }
  });
});

function openPromptSheet({title, placeholder, value='', onConfirm}){
  const el = document.createElement('div');
  el.className = 'sheet';
  el.style.zIndex = '107';
  el.innerHTML = `
    <div class="sheet-grip"><span></span></div>

      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn-ghost" id="promptCancel">${t('cancel')}</button>
      <button class="btn-primary" id="promptOk">${t('save')}</button>
    </div>`;
  document.body.appendChild(el);
  const s = new Sheet(el);
  const inp = el.querySelector('#promptInput');
  inp.value = value;
  inp.placeholder = placeholder || '';

  let confirmed = false;
  s.onClose = ()=>{
    const v = inp.value.trim();

      s.destroy(); el.remove();
      if(confirmed && v) onConfirm(v);
    }, 400);
  };

  el.querySelector('#promptCancel').addEventListener('click', ()=>s.close());
  el.querySelector('#promptOk').addEventListener('click', ()=>{ confirmed = true; s.close(); });
  inp.addEventListener('keydown', e=>{
    if(e.isComposing) return;
    if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); confirmed = true; s.close(); }
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); s.close(); }
  });

  requestAnimationFrame(()=>{
    s.open();
    try{ inp.focus(); inp.select(); }catch(_){}
    setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(_){} }, 100);
  });
}

/* ===================== ICON PICKER SHEET (TABBED) ===================== */
function openIconPicker({current='', onPick}){
  const el = document.createElement('div');
  el.className = 'sheet';
  el.style.zIndex = '107';

  let activeTab = 0;
  if(current){
    for(let i=0; i<ICON_PICKER_CATS.length; i++){
      if(ICON_PICKER_CATS[i].icons.includes(current)){ activeTab = i; break; }
    }
  }

  const tabsHtml = ICON_PICKER_CATS.map((c,i)=>{
    const lbl = c.label[state.lang] || c.label.id;
    return `<button class="icon-tab${i===activeTab?' active':''}" data-tab="${i}">${esc(lbl)}</button>`;
  }).join('');

  el.innerHTML = `
    <div class="sheet-grip"><span></span></div>
    <div class="sheet-head">
      <h2>${esc(t('pickIcon'))}</h2>
      <div class="sheet-head-actions">
        <button class="icon-reset-btn" id="iconAutoBtn">${t('iconAuto')}</button>
        <button class="icon-btn" data-close aria-label="Tutup">${icon('x',21)}</button>
      </div>
    </div>
    <div class="icon-tabs-wrap">
      <div class="icon-tabs" id="iconTabs">${tabsHtml}</div>
    </div>
    <div class="sheet-body">
      <div class="icon-grid" id="iconGrid"></div>
    </div>`;

  document.body.appendChild(el);

  const gridEl = el.querySelector('#iconGrid');
  const tabsEl = el.querySelector('#iconTabs');
  const bodyEl = el.querySelector('.sheet-body');
  const tabsWrap = el.querySelector('.icon-tabs-wrap');

  function renderGrid(tabIdx){
    const cat = ICON_PICKER_CATS[tabIdx];
    gridEl.innerHTML = cat.icons.map(k=>
      `<button class="icon-opt${k===current?' active':''}" data-icon="${k}" aria-label="${k}">${icon(k,22)}</button>`
    ).join('');
    bodyEl.scrollTop = 0;
  }
  renderGrid(activeTab);

  const s = new Sheet(el);
  let picked = null;
  s.onClose = ()=>setTimeout(()=>{
    s.destroy(); el.remove();
    if(picked !== null) onPick(picked);
  }, 400);

  tabsEl.addEventListener('click', e=>{
    const b = e.target.closest('[data-tab]');
    if(!b) return;
    const idx = +b.dataset.tab;
    tabsEl.querySelectorAll('.icon-tab').forEach((t,i)=>t.classList.toggle('active', i===idx));
    renderGrid(idx);
    const wrapRect = tabsWrap.getBoundingClientRect();
    const elRect = b.getBoundingClientRect();
    if(elRect.left < wrapRect.left){
      tabsWrap.scrollTo({left: b.offsetLeft - 12, behavior:'smooth'});
    } else if(elRect.right > wrapRect.right){
      tabsWrap.scrollTo({left: b.offsetLeft - wrapRect.width + b.offsetWidth + 12, behavior:'smooth'});
    }
  });

  gridEl.addEventListener('click', e=>{
    const b = e.target.closest('[data-icon]');
    if(!b) return;
    picked = b.dataset.icon;
    s.close();
  });

  el.querySelector('#iconAutoBtn').addEventListener('click', ()=>{
    picked = '__auto__';
    s.close();
  });

  requestAnimationFrame(()=>{
    s.open();
    setTimeout(()=>{
      const activeEl = tabsEl.querySelector('.icon-tab.active');
      if(!activeEl) return;
      const wrapRect = tabsWrap.getBoundingClientRect();
      const elRect = activeEl.getBoundingClientRect();
      if(elRect.left < wrapRect.left || elRect.right > wrapRect.right){
        tabsWrap.scrollLeft = activeEl.offsetLeft - 12;
      }
    }, 200);
  });
}

/* ===================== CHART ===================== */
function buildChartHtml(list){
  const cats = { income:{}, expense:{} };
  let totalIn = 0, totalEx = 0;
  for(const tx of list){
    const k = tx.type === 'income' ? 'income' : 'expense';
    cats[k][tx.category] = (cats[k][tx.category]||0) + tx.amount;
    if(k === 'income') totalIn += tx.amount; else totalEx += tx.amount;
  }
  let html = '';
  if(totalEx > 0) html += chartGroupHtml('expense', cats.expense, totalEx);
  if(totalIn > 0) html += chartGroupHtml('income', cats.income, totalIn);
  return html;
}
function chartGroupHtml(type, obj, total){
  const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const label = type === 'income' ? t('income') : t('expense');
  let rows = '';
  for(const [name, amt] of entries){
    const pct = (amt/total*100);
    const color = catColor(name);
    rows += `
      <button class="chart-row" data-cat="${esc(name)}" data-type="${type}">
        <div class="chart-info">
          <span class="chart-dot" style="background:${color}"></span>
          <span class="chart-name">${esc(name)}</span>
          <span class="chart-amt">${money(amt)}</span>
        </div>
        <div class="chart-bar"><i style="width:${pct}%;background:${color}"></i></div>
      </button>`;
  }
  return `
    <div class="chart-card">
      <div class="chart-head">
        <span class="chart-title">${label}</span>
        <span class="chart-total">${money(total)}</span>
      </div>
      ${rows}
    </div>`;
}

const histOverlay = $('#historyOverlay');

function renderHistory(){
  $('#histTitle').textContent = t('history');
  const list = [...state.tx].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const body = $('#histBody');
  if(!list.length){
    body.innerHTML = `<div class="empty" style="padding-top:var(--s6)">${icon('inbox',42)}<div>${t('noHistory')}</div></div>`;
    return;
  }
  const chartHtml = buildChartHtml(list);

  const groups = new Map();
  for(const tx of list){
    const k = tx.date.slice(0,7);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(tx);
  }
  let html = '';
  for(const [k, items] of groups){
    const d = fromKey(k + '-01');
    const label = new Intl.DateTimeFormat(localeFull(),{month:'long',year:'numeric'}).format(d);
    const sum = items.reduce((s,x)=> s + (x.type==='income'?x.amount:-x.amount), 0);
    html += `<div class="month-label">${label} · <span style="color:${sum>=0?'var(--in)':'var(--ex)'}">${sum>=0?'+':'−'}${money(Math.abs(sum))}</span></div>`;
    html += `<div class="card">${items.map(txRowHtml).join('')}</div>`;
  }
  body.innerHTML = chartHtml + html;
}
bindTxRows($('#histBody'));

$('#histBody').addEventListener('click', e=>{
  const row = e.target.closest('.chart-row[data-cat]');
  if(!row) return;
  openCategoryHistory(row.dataset.cat, row.dataset.type);
});

/* ===================== CATEGORY HISTORY ===================== */
const catOverlay = $('#catOverlay');
let currentCatView = null;

function openCategoryHistory(cat, type){
  currentCatView = { cat, type };
  renderCatHistory();
  catOverlay.classList.add('open');
}
function closeCatHistory(){
  catOverlay.classList.remove('open');
  currentCatView = null;
}
$('#catClose').addEventListener('click', closeCatHistory);

function renderCatHistory(){
  if(!currentCatView) return;
  const { cat, type } = currentCatView;
  const list = state.tx
    .filter(x => x.category === cat && x.type === type)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  $('#catTitle').textContent = cat;
  const body = $('#catBody');

  if(!list.length){
    body.innerHTML = `<div class="empty" style="padding-top:var(--s6)">${icon('inbox',42)}<div>${t('noCat')}</div></div>`;
    return;
  }

  const total = list.reduce((s,x)=>s+x.amount,0);
  const typeLabel = type === 'income' ? t('income') : t('expense');
  const color = catColorDeep(cat);
  const soft = catColorSoft(cat);

  let html = `<div class="cat-summary" style="background:${soft}">
    <div class="cat-summary-type" style="color:${color}">${typeLabel}</div>
    <div class="cat-summary-total" style="color:${color}">${money(total)}</div>
    <div class="cat-summary-count">${list.length} ${t('transactions')}</div>
  </div>`;

  const groups = new Map();
  for(const tx of list){
    const k = tx.date.slice(0,7);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(tx);
  }
  for(const [k, items] of groups){
    const d = fromKey(k + '-01');
    const label = new Intl.DateTimeFormat(localeFull(),{month:'long',year:'numeric'}).format(d);
    const sum = items.reduce((s,x)=>s+x.amount,0);
    html += `<div class="month-label">${label} · ${money(sum)}</div>`;
    html += `<div class="card">${items.map(txRowHtml).join('')}</div>`;
  }
  body.innerHTML = html;
}
bindTxRows($('#catBody'));

/* ===================== SIDE MENU ===================== */
const sideMenu = $('#sideMenu');
const smBackdrop = $('#smBackdrop');
function openSideMenu(){ renderMenuOptions(); sideMenu.classList.add('open'); smBackdrop.classList.add('show'); }
function closeSideMenu(){ sideMenu.classList.remove('open'); smBackdrop.classList.remove('show'); }
$('#menuBtn').innerHTML = icon('menu',21);
$('#menuBtn').addEventListener('click',openSideMenu);
$('#smClose').innerHTML = icon('x',21);
$('#smClose').addEventListener('click',closeSideMenu);
smBackdrop.addEventListener('click',closeSideMenu);

function renderMenuOptions(){
  $('#smTitle').textContent = t('settings');
  $('#lblCur').textContent = t('currency');
  $('#lblLang').textContent = t('language');
  $('#lblData').textContent = t('dataSettings');
  $('#expIcon').innerHTML = icon('download',18);
  $('#impIcon').innerHTML = icon('upload',18);
  $('#expText').textContent = t('exportData');
  $('#impText').textContent = t('importData');
  $('#resetBtn').innerHTML = icon('rotate',18) + t('reset');

  $('#curList').innerHTML = Object.entries(CURRENCIES).map(([k,c])=>
    `<button class="opt${state.currency===k?' active':''}" data-cur="${k}"><span>${c.label}</span><span class="tick">${icon('check',18)}</span></button>`
  ).join('');
  $('#langList').innerHTML = [['id','Bahasa Indonesia'],['en','English']].map(([k,l])=>
    `<button class="opt${state.lang===k?' active':''}" data-lang="${k}"><span>${l}</span><span class="tick">${icon('check',18)}</span></button>`
  ).join('');
}

$('#curList').addEventListener('click',e=>{
  const b = e.target.closest('[data-cur]');
  if(!b || b.dataset.cur === state.currency) return;
  state.currency = b.dataset.cur;
  Object.keys(fmtCache).forEach(k=>delete fmtCache[k]);
  save();
  renderMenuOptions();
  if(rawAmount) rawAmount = convertRawToCurrency(rawAmount);
  renderAmountWrap();
  refreshAll();
});

$('#langList').addEventListener('click',e=>{
  const b = e.target.closest('[data-lang]');
  if(!b || b.dataset.lang === state.lang) return;
  state.lang = b.dataset.lang;
  applyLangToDefaultCats(state.lang);
  save();
  document.documentElement.lang = state.lang;
  applyStaticTexts();
  renderMenuOptions();
  renderFormLabels();
  renderChips();
  refreshAll();
  updateViewPill();
  closeSideMenu();
});

/* ===================== EXPORT / IMPORT / RESET ===================== */
function exportData(){
  const data = {
    app: 'penny-note', version: 1,
    exportedAt: new Date().toISOString(),
    tx: state.tx, cats: state.cats,
    catIcons: state.catIcons,
    currency: state.currency, lang: state.lang
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date();
  const stamp = `${ts.getFullYear()}-${pad(ts.getMonth()+1)}-${pad(ts.getDate())}`;
  a.href = url;
  a.download = `penny-note-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
  toast(t('exported'));
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || data.app !== 'penny-note' || !Array.isArray(data.tx) || !data.cats ||
         !Array.isArray(data.cats.expense) || !Array.isArray(data.cats.income)){
        throw new Error('invalid');
      }
      const lang = data.lang === 'en' ? 'en' : 'id';
      const cats = sanitizeCats(data.cats, lang);
      state = {
        tx: sanitizeTxList(data.tx),
        cats,
        catIcons: sanitizeCatIcons(data.catIcons, cats),
        currency: CURRENCIES[data.currency] ? data.currency : 'IDR',
        lang
      };
      Object.keys(fmtCache).forEach(k=>delete fmtCache[k]);
      save();
      applyStaticTexts();
      renderMenuOptions();
      renderFormLabels();
      refreshAll();
      updateViewPill();
      toast(t('imported'));
    }catch(err){
      toast(t('importFailed'));
    }
  };
  reader.onerror = ()=>toast(t('importFailed'));
  reader.readAsText(file);
}
$('#exportBtn').addEventListener('click', exportData);
$('#importBtn').addEventListener('click', ()=> $('#importFile').click());
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(f) importData(f);
  e.target.value = '';
});

$('#resetBtn').addEventListener('click',()=>{
  openConfirmSheet({
    title: t('resetTitle'),
    message: t('resetConfirm'),
    confirmLabel: t('reset'),
    danger: true,
    onConfirm: ()=>{
      state = { tx:[], cats: getDefaultCats(state.lang), catIcons:{}, currency: state.currency, lang: state.lang };
      flushSave();
      closeSideMenu();
      applyStaticTexts();
      renderFormLabels();
      refreshAll();
      updateViewPill();
      toast(t('resetDone'));
    }
  });
});

/* ===================== STATIC TEXT ===================== */
function applyStaticTexts(){
  $('#niHome').innerHTML = icon('home',21);
  $('#niCal').innerHTML = icon('calendar',21);
  $('#nlHome').textContent = t('home');
  $('#nlCal').textContent = t('calendar');
  $('#lgIn').textContent = t('income');
  $('#lgEx').textContent = t('expense');
  $('#viewPillClose').setAttribute('aria-label', t('backToCurrent'));
  document.documentElement.lang = state.lang;
}

/* ===================== TOAST ===================== */
const toastEl = $('#toast');
toastEl.innerHTML = icon('check',16) + '<span></span>';
const toastSpan = toastEl.querySelector('span');
let toastTimer = null;
function toast(msg){
  toastSpan.textContent = msg;
  toastEl.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

/* ===================== REFRESH ===================== */
function refreshAll(){
  renderHome();
  renderCalendar();
  updateViewPill();
  if(histOverlay.classList.contains('open')) renderHistory();
  if(catOverlay.classList.contains('open')) renderCatHistory();
}

/* ===================== INIT ===================== */
(function init(){
  if(applyLangToDefaultCats(state.lang)) save();

  applyStaticTexts();
  renderFormLabels();
  refreshAll();
  dateInput.value = toKey(new Date());
  dateInput.max = '2099-12-31';

  let rt;
  window.addEventListener('resize',()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{
      const i = Math.round(track.scrollLeft / track.clientWidth);
      track.scrollTo({left: i * track.clientWidth, behavior:'auto'});
      updateViewPill();
    },180);
  });

  document.addEventListener('keydown',e=>{
    if(e.key === 'Escape'){
      if(sheetStack.length){
        sheetStack[sheetStack.length - 1].close();
        return;
      }
      if(sideMenu.classList.contains('open')) closeSideMenu();
      else if(catOverlay.classList.contains('open')) closeCatHistory();
      else if(histOverlay.classList.contains('open')) closeHistory();
    }
  });
})();
</script>
